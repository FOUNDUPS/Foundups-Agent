:href="#neutral" transform="translate(185,85) scale(.5)"/><text x="16" y="194" font-family="sans-serif" font-size="13" fill="#1F1F1F">20–25s · [soft scurrying]</text></g><g transform="translate(640,225)"><rect x="4" y="4" width="312" height="217" rx="12" fill="#FFF4D9"/><text x="16" y="28" font-family="sans-serif" font-size="16" fill="#1F1F1F">6. A giant step</text><path d="M10 160 Q150 145 310 160" stroke="#9C724F" stroke-width="5" fill="none"/><ellipse cx="160" cy="105" rx="130" ry="48" fill="#D9B78B"/><use href="#sleepy" xlink:href="#sleepy" transform="translate(185,85) scale(.5)"/><text x="16" y="194" font-family="sans-serif" font-size="13" fill="#1F1F1F">25–30s · [low thump, then quiet]</text></g><g transform="translate(0,450)"><rect x="4" y="4" width="312" height="217" rx="12" fill="#FFF4D9"/><text x="16" y="28" font-family="sans-serif" font-size="16" fill="#1F1F1F">7. Daylight returns</text><path d="M10 160 Q150 145 310 160" stroke="#9C724F" stroke-width="5" fill="none"/><use href="#neutral" xlink:href="#neutral" transform="translate(185,85) scale(.5)"/><text x="16" y="194" font-family="sans-serif" font-size="13" fill="#1F1F1F">30–35s · [gentle breeze]</text></g><g transform="translate(320,450)"><rect x="4" y="4" width="312" height="217" rx="12" fill="#FFF4D9"/><text x="16" y="28" font-family="sans-serif" font-size="16" fill="#1F1F1F">8. Follow the smell</text><path d="M10 160 Q150 145 310 160" stroke="#9C724F" stroke-width="5" fill="none"/><use href="#surprised" xlink:href="#surprised" transform="translate(185,85) scale(.5)"/><text x="16" y="194" font-family="sans-serif" font-size="13" fill="#1F1F1F">35–40s · [sneeze, sniff]</text></g><g transform="translate(640,450)"><rect x="4" y="4" width="312" height="217" rx="12" fill="#FFF4D9"/><text x="16" y="28" font-family="sans-serif" font-size="16" fill="#1F1F1F">9. One enormous footprint</text><path d="M10 160 Q150 145 310 160" stroke="#9C724F" stroke-width="5" fill="none"/><path transform="translate(0,25) scale(
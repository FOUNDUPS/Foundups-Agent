<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" role="img" aria-labelledby="title desc"><title id="title">旧羽生小学校周辺で確認した送電・変電設備</title><desc id="desc">2026年9月26日の現地確認写真。送電・変電設備が近接して見えるが、受電可能容量、接続権、電圧、工期、費用を証明するものではない。</desc><image width="100%" height="100%" href="data:image/webp;base64,[... ELLIPSIZATION ...]"/></svg>
 const check=(name,ok,detail={})=>{rows.push({name,result:ok?'PASS':'FAIL',...detail});results.textContent=JSON.stringify(rows,null,2);if(!ok)throw Error(name);};
 async function seekForLayout(video,time,w){
  async function ready(predicate,phase){
   const deadline=performance.now()+8000;
   while(!predicate()){
    if(video.error)throw Error('Video error during '+phase+': '+video.error.code);
    if(performance.now()>=deadline)throw Error('Video '+phase+' timed out at '+video.currentTime+'s (requested '+time+'s, readyState '+video.readyState+', seeking '+video.seeking+')');
    await wait(25);
   }
  }
  await ready(()=>video.readyState>=1&&Number.isFinite(video.duration)&&video.duration>time,'metadata readiness');
  video.pause();
  let targetSeeked=!video.seeking&&Math.abs(video.currentTime-time)<.05;
  const sought=()=>{if(!video.seeking&&Math.abs(video.currentTime-time)<.05)targetSeeked=true;};
  video.addEventListener('seeked',sought);
  try{
   if(!targetSeeked)video.currentTime=time;
   await ready(()=>targetSeeked&&!video.seeking&&video.readyState>=2&&Math.abs(video.currentTime-time)<.05,'target seek readiness');
   await new Promise((resolve,reject)=>{
    let frameId,remaining=2;
    const timeout=w.setTimeout(()=>{w.cancelAnimationFrame(frameId);reject(Error('Layout frames timed out after seek to '+time+'s'));},3000);
    const next=()=>{if(--remaining===0){w.clearTimeout(timeout);resolve();}else frameId=w.requestAnimationFrame(next);};
    frameId=w.requestAnimationFrame(next);
   });
  }finally{video.removeEventListener('seeked',sought);}
 }

  const loaded=new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));frame.width=size[0];frame.height=size[1];frame.src=entry;await loaded;
  const d=frame.contentDocument,w=frame.contentWindow,$=id=>d.getElementById(id);
  for(let n=0;n<100&&!($('video-play')&&$('game').contentWindow.storytimeReview);n++)await wait(100);

   check('controls do not overlap',rects.every((a,i)=>rects.every((b,j)=>i===j||!overlap(a,b))),{size,mode});

   if(mode==='video'&&size[0]>size[1]&&size[1]<=500)check('landscape video has useful size',surface.height>=(size[1]-safe[0]-safe[2])*.6,{size,height:surface.height});
  }

  check('one rail while drawing',!visible(d.querySelector('.game-controls'))&&visible($('feedback-actions')),{entry,size});inspect($('game-panel'),'drawing');
  const clock=api.status().clock;$('full-game').click();$('full-game').click();check('drawing and clock retained',!$('ink').hidden&&clock===api.status().clock,{size});

  }}
  ['top','right','bottom','left'].forEach(n=>d.documentElement.style.removeProperty('--safe-'+n));

 results.textContent+='\nCOMPLETE';

const effectiveOpacity=(el,w)=>{
 let opacity=1;
 for(let node=el;node&&node.nodeType===1;node=node.parentElement){const s=w.getComputedStyle(node);if(s.display==='none'||s.visibility==='hidden')return 0;opacity*=Number(s.opacity);}

const visuallyPresent=(el,w)=>{if(!el||effectiveOpacity(el,w)<=.05)return false;const r=el.getBoundingClientRect();return r.width>0&&r.height>0;};
async function mediaLayoutSeek(video,time,w){
 const ready=async(predicate,label)=>{const deadline=performance.now()+10000;while(!predicate()){if(video.error)throw Error('Movie failed during '+label);if(performance.now()>deadline)throw Error('Movie '+label+' timed out');await wait(25);}};
 await ready(()=>video.readyState>=1&&video.duration>time,'metadata');video.pause();
 if(video.seeking||Math.abs(video.currentTime-time)>.001)video.currentTime=time;
 await ready(()=>!video.seeking&&video.readyState>=2&&Math.abs(video.currentTime-time)<.002,'layout seek');

}

 const rect=r=>({left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height});

 let canonicalBottom=null;
 if(svg&&visuallyPresent(svg,w)){const r=svg.getBoundingClientRect(),box=svg.viewBox.baseVal,scale=Math.min(r.width/box.width,r.height/box.height);canonicalBottom=r.top+(r.height-box.height*scale)/2+(-box.y+540)*scale;}
 return {mode:panel.dataset.wordPlacement,ready:panel.classList.contains('movie-responsive'),sceneGroups:sceneGroups.length,sceneWords:sceneGroups.map(g=>g.querySelector('text')?.textContent),separateVisible:visuallyPresent(phrase,w)&&!!phrase.textContent,separateWord:phrase.textContent,separateFont:parseFloat(w.getComputedStyle(phrase).fontSize),word:rect(word),caption:rect(caption.getBoundingClientRect()),canonicalBottom,controls:rect(rail.getBoundingClientRect()),surface:rect(panel.querySelector('.surface').getBoundingClientRect()),panelScrollTop:panel.scrollTop,panelScrollHeight:panel.scrollHeight,panelClientHeight:panel.clientHeight};

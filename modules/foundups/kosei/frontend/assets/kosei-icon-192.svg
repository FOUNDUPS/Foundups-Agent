<svg width="192" height="192" viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded rectangle background -->
  <rect width="192" height="192" rx="30" fill="#6366f1"/>

  <!-- First diamond (solid white) -->
  <g transform="translate(96, 96)">
    <polygon points="0,-38 38,0 0,38 -38,0" fill="white"/>
  </g>

  <!-- Second diamond (semi-transparent white, rotated 45°) -->
  <g transform="translate(96, 96) rotate(45)">
    <polygon points="0,-27 27,0 0,27 -27,0" fill="white" opacity="0.5"/>
  </g>
</svg>

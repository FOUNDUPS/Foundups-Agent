<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded rectangle background -->
  <rect width="512" height="512" rx="80" fill="#6366f1"/>

  <!-- First diamond (solid white) -->
  <g transform="translate(256, 256)">
    <polygon points="0,-100 100,0 0,100 -100,0" fill="white"/>
  </g>

  <!-- Second diamond (semi-transparent white, rotated 45°) -->
  <g transform="translate(256, 256) rotate(45)">
    <polygon points="0,-70 70,0 0,70 -70,0" fill="white" opacity="0.5"/>
  </g>
</svg>

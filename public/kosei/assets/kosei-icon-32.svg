<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Rounded rectangle background -->
  <rect width="32" height="32" rx="5" fill="#6366f1"/>

  <!-- First diamond (solid white) -->
  <g transform="translate(16, 16)">
    <polygon points="0,-6.5 6.5,0 0,6.5 -6.5,0" fill="white"/>
  </g>

  <!-- Second diamond (semi-transparent white, rotated 45°) -->
  <g transform="translate(16, 16) rotate(45)">
    <polygon points="0,-4.5 4.5,0 0,4.5 -4.5,0" fill="white" opacity="0.5"/>
  </g>
</svg>

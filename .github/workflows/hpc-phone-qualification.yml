name: HPC phone qualification

on:
  push:
    branches: [fix/hpc-phone-start-scroll-20261120]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hpc-phone-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    if: github.ref == 'refs/heads/fix/hpc-phone-start-scroll-20261120'
    uses: ./.github/workflows/security-scan.yml

  browser-policy:
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      # Official v1.62.0-noble image; browsers and system libraries are prebuilt.
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble@sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d
      options: --init --shm-size=1g
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact source and qualification boundary
        shell: bash
        run: |
          set -euo pipefail
          # Trust only this job's checked-out workspace, for this command.
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          export HPC_EVIDENCE_DIR="$RUNNER_TEMP/hpc-phone-qualification"
          printf 'HPC_EVIDENCE_DIR=%s\n' "$HPC_EVIDENCE_DIR" >> "$GITHUB_ENV"
          mkdir -p "$HPC_EVIDENCE_DIR"
          python -B - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          files = [
              'public/index.html', 'public/f/index.html',
              'public/member/index.html', 'public/member/foundup.html',
              'public/member/member-sw.js', 'public/member/mall-video-catalog.json',
              'public/member/discovery/catalog.json',
              'scripts/refresh_mall_catalog.py',
              'scripts/hpc_preview_metadata.cjs',
              'scripts/tests/hpc_preview_metadata_vm.cjs',
              'public/member/tests/mall_scoped_video_browser.py',
              'public/member/tests/mall_queue_callbacks_browser.py',
              'public/member/tests/mall_public_tv_browser.py',
              'public/member/tests/mall_phone_ui_browser.py',
              'public/member/tests/mall_projection_routing_vm.mjs',
              'public/member/tests/public_discovery_concierge_vm.mjs',
              'public/member/tests/mall_admission_preferences_vm.mjs',
              'public/member/tests/mall_browser_ai_pilot_vm.mjs',
              'public/member/tests/mall_local_activity_vm.mjs',
              'public/member/wasm/pilot-add.wasm',
              'public/member/tests/mall_product_state_vm.mjs',
              'public/member/tests/mall_property_listing_vm.mjs',
              'public/member/tests/legacy_navigation_runtime_vm.mjs',
              'public/member/tests/test_localhost_dev_harness.py',
              'public/member/tests/test_non_video_action_surfaces.py',
              'public/member/tests/test_video_mall_field_runtime.py',
              'public/member/tests/test_mall_product_state.py',
              'modules/foundups/pfmall/tests/fixtures/hpc_iphone_playback_probe.js',
              'modules/foundups/pfmall/tests/fixtures/hpc_iphone_playback_reference.html',
              'modules/foundups/pfmall/tests/fixtures/hpc_iphone_playback_probe_vm.mjs',
              'modules/foundups/pfmall/tests/fixtures/hpc_preview_metadata_stale_v25.json',
              'public/member/tests/test_mall_tile_field.py',
              'public/member/tests/test_refresh_catalog_safety.py',
              'modules/foundups/pfmall/tests/test_member_pwa_hardening.py',
              '.github/workflows/hpc-phone-qualification.yml',
              'requirements-trust-bootstrap.txt',
          ]
          generation = json.loads(pathlib.Path('public/member/discovery/catalog.json').read_text())['generation']
          for pattern in [
              'public/member/js/*.js', 'public/member/css/*.css',
              f'public/member/discovery/{generation}/**/*.json',
          ]:
              files.extend(str(p) for p in pathlib.Path('.').glob(pattern) if p.is_file())
          files = sorted(set(files))
          receipt = {
              'source_sha': os.environ['GITHUB_SHA'],
              'source_tree': subprocess.check_output(['git', '-c', 'safe.directory=' + os.environ['GITHUB_WORKSPACE'], 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'playwright_version': '1.62.0',
              'mall_build': 'v26', 'discovery_generation': generation,
              'browser_image_digest': 'sha256:aa81288e738725378becba5b3e06cb0f3a7f012a610e87e8d767a090ea3f740d',
              'source_sha256': {p: hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files},
              'scope': 'Integrated v26 shell, recovered v24 discovery data and CSS; controlled provider/network fixtures in Chromium and WebKit; actual worker/state VM and targeted static contracts.',
              'real_youtube': 'UNEXECUTED', 'physical_iphone': 'UNEXECUTED', 'deployment': 'NONE',
          }
          pathlib.Path(os.environ['HPC_EVIDENCE_DIR'], 'source.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Bootstrap checksum-verified Python trust
        run: python -m pip --isolated install --upgrade --no-deps --require-hashes -r requirements-trust-bootstrap.txt
      - name: Install matching browser and contract-test packages
        timeout-minutes: 5
        run: |
          python -m pip --isolated install --only-binary=:all: playwright==1.62.0 pytest==9.2.0
          python -m pip freeze > "$HPC_EVIDENCE_DIR/dependencies.txt"
          node --version >> "$HPC_EVIDENCE_DIR/dependencies.txt"
      - name: Qualify integrated phone, desktop, paging and cache behavior
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          combined_status=0
          run_gate() {
            local gate_name="$1"
            local gate_status=0
            local gate_seconds=180
            # Additional settings viewport/Close coverage has its own finite
            # budget; preserve every original gate's deadline and assertions.
            if [ "$gate_name" = "settings-ui" ]; then gate_seconds=240; fi
            shift
            timeout --signal=TERM --kill-after=5s "${gate_seconds}s" "$@" 2>&1 | tee "$HPC_EVIDENCE_DIR/$gate_name.log" || gate_status=$?
            printf '%s_exit=%s\n' "$gate_name" "$gate_status" >> "$HPC_EVIDENCE_DIR/outcomes.txt"
            if [ "$gate_status" -ne 0 ]; then combined_status=1; fi
          }
          run_gate player-policy python -B public/member/tests/mall_scoped_video_browser.py --player-policy
          run_gate queue-callbacks python -B public/member/tests/mall_queue_callbacks_browser.py
          run_gate public-tv python -B public/member/tests/mall_public_tv_browser.py --worker
          run_gate phone-ui python -B public/member/tests/mall_phone_ui_browser.py --include-defensive
          run_gate settings-ui python -B public/member/tests/mall_phone_ui_browser.py --case settings-close-recovery --case dock-refinement --case global-autoplay --case desktop-autoplay-startup --case non-hpc-plus-swipe
          run_gate probe-release-metadata node scripts/tests/hpc_preview_metadata_vm.cjs
          run_gate worker-state node public/member/tests/mall_product_state_vm.mjs
          run_gate admission-preferences node public/member/tests/mall_admission_preferences_vm.mjs
          run_gate admission-routing node public/member/tests/mall_projection_routing_vm.mjs
          run_gate member-boot node public/member/tests/member_product_boot_vm.mjs
          run_gate browser-ai-compatibility node public/member/tests/mall_browser_ai_pilot_vm.mjs
          run_gate local-activity node public/member/tests/mall_local_activity_vm.mjs
          run_gate public-concierge node public/member/tests/public_discovery_concierge_vm.mjs
          run_gate property-navigation node public/member/tests/mall_property_listing_vm.mjs
          run_gate entry-actions node public/member/tests/legacy_navigation_runtime_vm.mjs
          run_gate static-contracts python -B -m pytest -q -c /dev/null --noconftest -p no:cacheprovider \
            public/member/tests/test_mall_tile_field.py \
            public/member/tests/test_mall_product_state.py \
            modules/foundups/pfmall/tests/test_member_pwa_hardening.py \
            public/member/tests/test_refresh_catalog_safety.py
          exit "$combined_status"
      - name: Retain public-TV request and geometry receipt
        if: always()
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/../mall_v26_public_tv_qa.json" ]; then
            cp "$GITHUB_WORKSPACE/../mall_v26_public_tv_qa.json" "$HPC_EVIDENCE_DIR/"
          fi
      - name: Retain source receipt and browser logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hpc-phone-qualification-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hpc-phone-qualification
          if-no-files-found: error
          retention-days: 7

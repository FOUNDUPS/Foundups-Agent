name: Security scan

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '20 20 * * 0' # Monday 05:20 JST; full retained history

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate security gate regressions
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pip install pytest
          python -B -m pytest -q -c /dev/null --noconftest -p no:cacheprovider scripts/tests/test_ci_security_gate.py
      - name: Install checksum-pinned Gitleaks 8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar --no-same-owner -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan tracked tree and commit history (blocking)
        env:
          SECURITY_EVENT: ${{ github.event_name }}
          SECURITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SECURITY_HEAD: ${{ github.sha }}
        run: python .github/scripts/security_gate.py

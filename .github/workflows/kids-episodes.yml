name: Kids Episodes
on:
  pull_request:
    paths:
      - 'modules/communication/youtube_shorts/**'
      - 'modules/foundups/kids_episodes/**'
      - 'modules/foundups/eduit/**'
      - 'public/eduit/**'
      - 'modules/foundups/foundup_registry*'
      - 'modules/communication/moltbot_bridge/src/openclaw_execution_routes.py'
      - 'modules/communication/moltbot_bridge/tests/test_openclaw_kids_story_route.py'
      - '.github/workflows/kids-episodes.yml'
  push:
    branches: [main]
    paths:
      - 'modules/communication/youtube_shorts/**'
      - 'modules/foundups/kids_episodes/**'
      - 'modules/foundups/eduit/**'
      - 'public/eduit/**'
      - 'modules/foundups/foundup_registry*'
      - 'modules/communication/moltbot_bridge/src/openclaw_execution_routes.py'
      - 'modules/communication/moltbot_bridge/tests/test_openclaw_kids_story_route.py'
      - '.github/workflows/kids-episodes.yml'
permissions:
  contents: read
jobs:
  local-episode-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap checksum-verified Python trust
        run: python -m pip --isolated install --upgrade --no-deps --require-hashes -r requirements-trust-bootstrap.txt
      - name: Install test and rendering dependencies
        run: |
          python -m pip install pytest==9.0.3 jsonschema==4.26.0 PyYAML==6.0.3 google-api-python-client==2.187.0
          python -m pip install -r modules/communication/youtube_shorts/requirements-local-preview.txt
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Story Time interaction
        run: node --test modules/foundups/eduit/tests/*.test.mjs modules/communication/youtube_shorts/tests/kids_review.test.mjs
      - name: Verify Story Time PWA packaging
        run: python -B -m unittest discover -s modules/foundups/eduit/tests -p 'test_*.py'
      - name: Verify renderer, local editor, research contracts and registry
        run: >-
          python -B -m pytest -q -c /dev/null --noconftest --import-mode=importlib
          modules/communication/youtube_shorts/tests/test_youtube_publisher_boundary.py
          modules/communication/youtube_shorts/tests/test_kids_episode.py
          modules/communication/youtube_shorts/tests/test_kids_editor_server.py
          modules/communication/youtube_shorts/tests/test_kids_research.py
          modules/communication/youtube_shorts/tests/test_openrouter_storyboard.py
          modules/communication/youtube_shorts/tests/test_little_shrew_preview.py
          modules/foundups/kids_episodes/tests
          modules/communication/moltbot_bridge/tests/test_openclaw_kids_story_route.py
          modules/foundups/tests/test_foundup_registry_schema.py
          modules/foundups/tests/test_foundup_registry_loader.py

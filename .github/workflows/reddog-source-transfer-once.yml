name: RedDog source transfer (temporary)
on:
  push:
    branches: [feature/reddog-public-continuity-20260908]
permissions:
  contents: read
jobs:
  source:
    if: github.repository == 'FOUNDUPS/Foundups-Agent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8980aa29b2a17655ad5d927c94059c068400c118
          persist-credentials: false
      - name: Export only already-public tracked source
        run: |
          git archive --format=tar.gz -o "$RUNNER_TEMP/reddog-base.tar.gz" HEAD
          git rev-parse HEAD > "$RUNNER_TEMP/reddog-base-sha.txt"
          sha256sum "$RUNNER_TEMP/reddog-base.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: reddog-base-source
          path: |
            ${{ runner.temp }}/reddog-base.tar.gz
            ${{ runner.temp }}/reddog-base-sha.txt
          retention-days: 1
          if-no-files-found: error

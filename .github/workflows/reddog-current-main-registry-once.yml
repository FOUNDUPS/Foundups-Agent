name: RedDog current-main registry (temporary)

on:
  push:
    branches:
      - fix/reddog-current-main-reconciliation-20260912
    paths:
      - .github/workflows/reddog-current-main-registry-once.yml

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate canonical registry and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python modules/infrastructure/wre_core/scripts/generate_test_registry.py --write
          git rm .github/workflows/reddog-current-main-registry-once.yml
          python modules/infrastructure/wre_core/scripts/generate_test_registry.py --check
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WSP_knowledge/WSP_Test_Registry.json
          git commit -m "chore(reddog): register current-main host lease test"
          git push origin HEAD:fix/reddog-current-main-reconciliation-20260912
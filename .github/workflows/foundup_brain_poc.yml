name: FoundUp Brain POC

on:
  pull_request:
    branches: [main]
    paths:
      - 'modules/communication/moltbot_bridge/src/foundup_brain_current_state.py'
      - 'modules/communication/moltbot_bridge/src/reddog_operational_context_snapshot.py'
      - 'modules/communication/moltbot_bridge/tests/test_foundup_brain_current_state.py'
      - 'modules/communication/moltbot_bridge/tests/test_reddog_operational_context_snapshot.py'
      - 'modules/communication/moltbot_bridge/tests/TestModLog_FoundUpBrain.md'
      - 'docs/architecture/REDDOG_FOUNDUPS_SECOND_BRAIN_ARCHITECTURE.md'
      - 'docs/adr/ADR_REDDOG_FOUNDUPS_SECOND_BRAIN_BOUNDARY.md'
      - 'docs/architecture/architecture_registry.yaml'
      - '.github/workflows/foundup_brain_poc.yml'
  push:
    branches: [main]
    paths:
      - 'modules/communication/moltbot_bridge/src/foundup_brain_current_state.py'
      - 'modules/communication/moltbot_bridge/src/reddog_operational_context_snapshot.py'
      - 'modules/communication/moltbot_bridge/tests/test_foundup_brain_current_state.py'
      - 'modules/communication/moltbot_bridge/tests/test_reddog_operational_context_snapshot.py'
      - 'modules/communication/moltbot_bridge/tests/TestModLog_FoundUpBrain.md'
      - 'docs/architecture/REDDOG_FOUNDUPS_SECOND_BRAIN_ARCHITECTURE.md'
      - 'docs/adr/ADR_REDDOG_FOUNDUPS_SECOND_BRAIN_BOUNDARY.md'
      - 'docs/architecture/architecture_registry.yaml'
      - '.github/workflows/foundup_brain_poc.yml'

jobs:
  focused-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Compile FoundUp Brain contract
        run: |
          python -m py_compile \
            modules/communication/moltbot_bridge/src/foundup_brain_current_state.py \
            modules/communication/moltbot_bridge/tests/test_foundup_brain_current_state.py

      - name: Run FoundUp Brain and snapshot tests
        run: |
          python -m pytest \
            modules/communication/moltbot_bridge/tests/test_foundup_brain_current_state.py \
            modules/communication/moltbot_bridge/tests/test_reddog_operational_context_snapshot.py \
            -q --tb=short

      - name: Verify WSP 22 supplemental TestModLog registration
        run: |
          grep -q 'FOUNDUP_BRAIN_CURRENT_STATE_ASSEMBLY_PHASE1' \
            modules/communication/moltbot_bridge/tests/TestModLog_FoundUpBrain.md

      - name: Verify diff hygiene
        run: git diff --check HEAD^

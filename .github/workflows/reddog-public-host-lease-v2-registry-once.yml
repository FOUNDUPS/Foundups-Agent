name: RedDog Lick-aware host lease registry (temporary)
on:
  push:
    branches: [feature/reddog-public-host-lease-recovery-v2-20260908]
permissions:
  contents: write
jobs:
  register:
    if: github.repository == 'FOUNDUPS/Foundups-Agent'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate canonical registry and self-remove
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python modules/infrastructure/wre_core/scripts/generate_test_registry.py --write
          git rm .github/workflows/reddog-public-host-lease-v2-registry-once.yml
          python modules/infrastructure/wre_core/scripts/generate_test_registry.py --check
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WSP_knowledge/WSP_Test_Registry.json
          git commit -m "chore(reddog): register Lick-aware host lease test"
          git push origin HEAD:feature/reddog-public-host-lease-recovery-v2-20260908

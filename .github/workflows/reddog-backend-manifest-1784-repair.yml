name: RedDog backend manifest repair 1784

on:
  push:
    branches:
      - fix/reddog-backend-manifest-1784-clean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce exact current-main rejection
        run: |
          node - <<'NODE'
          const path = require('node:path');
          const preflight = require('./extensions/reddog/backend_compatibility_preflight');
          const result = preflight.runBackendCompatibilityPreflight(path.resolve('.'));
          console.log(JSON.stringify(result, null, 2));
          const expected = 'required_runtime_file_integrity_mismatch:modules/infrastructure/wre_core/skillz/skills_registry_v2.json';
          if (result.passed || !result.rejection_reasons.includes(expected)) process.exit(1);
          NODE
      - name: Record bounded repair evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          modlog = Path('extensions/reddog/ModLog.md')
          testlog = Path('extensions/reddog/tests/TestModLog.md')
          mod_entry = """## 2026-09-19 - Reconcile WRE Skillz registry backend hash\n\n- Reproduced issue #1784 on exact current main: the authenticated backend manifest itself remained canonical, but runtime integrity failed closed only for `modules/infrastructure/wre_core/skillz/skills_registry_v2.json`.\n- The registry changed after the prior backend pin as new governed Skillz were registered. Regenerated the existing 1,400-file backend inventory and refreshed the canonical manifest digest; no runtime membership, compatibility assertion, authority boundary, or gate was weakened. WSP 00, 95, 97.\n\n"""
          test_entry = """## 2026-09-19 - Backend inventory after Skillz registry registration\n\n- `runBackendCompatibilityPreflight(repoRoot)` reproduced the exact fail-closed reason from issue #1784: `required_runtime_file_integrity_mismatch:modules/infrastructure/wre_core/skillz/skills_registry_v2.json`.\n- Regenerated the canonical 1,400-file inventory after the WRE Skillz registry changes, refreshed the manifest pin, and kept `test_backend_compatibility_contract.js` unchanged. The focused backend compatibility test and generator `--check` must pass before this repair can commit.\n\n"""
          for path, entry in ((modlog, mod_entry), (testlog, test_entry)):
              text = path.read_text(encoding='utf-8')
              first_nl = text.find('\n')
              path.write_text(text[:first_nl+1] + '\n' + entry + text[first_nl+1:].lstrip('\n'), encoding='utf-8')
          PY
      - name: Regenerate canonical backend manifest and pin
        run: |
          python scripts/generate_reddog_backend_manifest.py --write
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          manifest_path = Path('scripts/reddog_backend_manifest.json')
          obj = json.loads(manifest_path.read_text(encoding='utf-8'))
          payload = json.dumps(obj, sort_keys=True, separators=(',', ':')).encode('utf-8')
          digest = hashlib.sha256(payload).hexdigest()
          constants = Path('extensions/reddog/backend_compatibility_constants.js')
          text = constants.read_text(encoding='utf-8')
          new_text, count = re.subn(
              r"const EXPECTED_MANIFEST_SHA256 = '[a-f0-9]{64}';",
              f"const EXPECTED_MANIFEST_SHA256 = '{digest}';",
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('manifest pin replacement failed')
          constants.write_text(new_text, encoding='utf-8')
          print(f'canonical_manifest_sha256={digest}')
          PY
      - name: Verify generator and focused backend contract
        run: |
          python scripts/generate_reddog_backend_manifest.py --check
          node --test extensions/reddog/tests/test_backend_compatibility_contract.js
          node - <<'NODE'
          const path = require('node:path');
          const preflight = require('./extensions/reddog/backend_compatibility_preflight');
          const result = preflight.runBackendCompatibilityPreflight(path.resolve('.'));
          console.log(JSON.stringify(result, null, 2));
          if (!result.passed) process.exit(1);
          NODE
      - name: Remove temporary repair workflow and commit bounded fix
        run: |
          git config user.name '0102'
          git config user.email 'info@foundups.com'
          git rm .github/workflows/reddog-backend-manifest-1784-repair.yml
          git add scripts/reddog_backend_manifest.json extensions/reddog/backend_compatibility_constants.js extensions/reddog/ModLog.md extensions/reddog/tests/TestModLog.md
          git diff --cached --check
          git commit -m 'fix(reddog): refresh backend manifest after Skillz registry changes'
          git push origin HEAD:fix/reddog-backend-manifest-1784-clean

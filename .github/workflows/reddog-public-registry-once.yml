name: RedDog public registry bootstrap

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  register-owned-tests:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/reddog-public-lick-admission-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test then generate the canonical registry
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          python -m pip install pytest==9.0.2 coverage==7.13.3 fastapi==0.128.2 httpx==0.28.1
          python -m pytest -q --confcutdir=modules/communication/moltbot_bridge/tests/public_surface modules/communication/moltbot_bridge/tests/public_surface
          python modules/infrastructure/wre_core/scripts/generate_test_registry.py --write
          python modules/infrastructure/wre_core/scripts/generate_test_registry.py --check
      - name: Commit only generated registry to the owned unchanged PR head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch='feature/reddog-public-lick-admission-20260908'
          current="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$current" = "$EXPECTED_HEAD"
          changes="$(git diff --name-only)"
          if [ -z "$changes" ]; then exit 0; fi
          test "$changes" = 'WSP_knowledge/WSP_Test_Registry.json'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- WSP_knowledge/WSP_Test_Registry.json
          git commit -m 'chore(reddog): register public-surface boundary tests'
          git push origin "HEAD:refs/heads/$branch"

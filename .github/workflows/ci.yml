  gotjunk-backend-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap checksum-verified Python trust
        run: python -m pip --isolated install --upgrade --no-deps --require-hashes -r requirements-trust-bootstrap.txt
      - name: Install separate backend dependencies
        run: python -m pip install -r modules/foundups/gotjunk/backend/requirements.txt pytest httpx
      - name: Verify parser and API admission
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B -m pytest -q -c /dev/null --noconftest
          -o pythonpath=. -p no:cacheprovider
          modules/foundups/gotjunk/tests/test_backend_security.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5

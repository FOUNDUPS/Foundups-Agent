name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Stacked PRs need their own checks even when their base is a feature branch.
    # Retargeting a PR must also produce fresh evidence for its new base.
    types: [opened, synchronize, reopened, edited, ready_for_review]

jobs:
  principal-activity-ledger:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Verify isolated ledger, key lifecycle and existing disclosure boundary
        shell: bash
        run: |
          set -euo pipefail
          node extensions/reddog/tests/test_principal_activity_ledger.js
          node extensions/reddog/tests/test_principal_activity_extension_adapter.js
          node extensions/reddog/tests/test_principal_activity_runtime_registration.js
          node extensions/reddog/tests/test_principal_memex_disclosure_source.js
          node extensions/reddog/tests/test_package_manifest.js

  youtube-operator-command:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Bootstrap checksum-verified Python trust
        run: python -m pip --isolated install --upgrade --no-deps --require-hashes -r requirements-trust-bootstrap.txt
      - name: Install bounded offline runner
        run: python -m pip install pytest==9.0.3 pytest-asyncio==1.3.0
      - name: Verify claims, process recovery, lifecycle and context consumption
        run: >-
          python -B -m pytest --import-mode=importlib -p pytest_asyncio.plugin -q --tb=short
          modules/communication/livechat/tests/test_operator_command_queue.py
          modules/communication/livechat/tests/test_operator_command_lifecycle.py
          modules/communication/video_comments/tests/test_commenting_control_plane.py

      - name: Verify isolated reply provenance and row context
        run: >-
          python -B -m pytest --import-mode=importlib -o addopts=
          -p pytest_asyncio.plugin -p no:cacheprovider -q --tb=short
          modules/communication/video_comments/tests/test_reply_context_pipeline.py
          --junitxml=reply-context-results.xml
      - name: Require the reviewed reply case inventory without skips
        shell: python
        run: |
          import hashlib
          import xml.etree.ElementTree as ET
          root = ET.parse('reply-context-results.xml').getroot()
          cases = list(root.iter('testcase'))
          assert cases and not any(list(root.iter(tag)) for tag in ('failure', 'error', 'skipped'))
          names = sorted(case.get('name') for case in cases)
          digest = hashlib.sha256('\n'.join(names).encode()).hexdigest()
          assert digest == '909f31dfc4a764e43cf1ae618ee2e03fcd4a14a02ddb803ff6c85ef5cfd77c6f', (len(cases), digest)
      - name: Preserve reply context results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reply-context-results-${{ matrix.os }}
          path: reply-context-results.xml
          if-no-files-found: error

  youtube-selected-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap checksum-verified Python trust
        run: python -m pip --isolated install --upgrade --no-deps --require-hashes -r requirements-trust-bootstrap.txt
      - name: Install bounded offline test dependencies
        run: >-
          python -m pip install pytest==9.0.3 pytest-asyncio==1.3.0
          selenium==4.35.0 numpy==1.26.4 pytz==2025.2 python-dotenv==1.2.2
          requests==2.33.0 pydantic==2.11.5
      - name: Verify selected clips, preview, receipts and transcript compatibility
        run: |
          python -B -m pytest --import-mode=importlib -p pytest_asyncio.plugin -q --tb=short \
            modules/platform_integration/youtube_shorts_scheduler/tests/test_remote_cli.py \
            modules/platform_integration/youtube_shorts_scheduler/tests/test_schedule_include_private.py \
            modules/platform_integration/youtube_shorts_scheduler/tests/test_index_metadata_decoupling.py \
            modules/platform_integration/youtube_shorts_scheduler/tests/test_peak_window.py \
            modules/platform_integration/youtube_shorts_scheduler/tests/test_visibility_filter_enforcement.py \
            modules/communication/moltbot_bridge/tests/test_youtube_automation_adapter.py \
            modules/communication/voice_command_ingestion/tests/test_transcript_language.py \
            modules/communication/voice_command_ingestion/tests/test_voice_command_ingestion.py \
            modules/ai_intelligence/video_indexer/tests/test_audio_transcript_language.py
      - name: Verify stream checker global and local quota boundaries
        run: python -B modules/platform_integration/stream_resolver/tests/test_no_quota_stream_checker.py -v
      - name: Verify live handoff and owned worker settlement
        run: >-
          python -B -m pytest --import-mode=importlib -o addopts=
          -p no:cacheprovider -p pytest_asyncio.plugin -q --tb=short
          modules/communication/livechat/tests/test_live_handoff_selective_cancellation.py
          modules/communication/livechat/tests/test_engagement_runner_lifecycle.py

  mcp-runtime-compatibility:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap checksum-verified Python trust
        run: python -m pip --isolated install --upgrade --no-deps --require-hashes -r requirements-trust-bootstrap.txt
      - name: Prepare isolated MCP candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path O:\) { throw 'O: is already owned; refusing to reuse it' }
          # A real volume preserves the O: identity through Path.resolve().
          # SUBST would resolve to its C:/D: backing directory.
          $volume = Join-Path $env:RUNNER_TEMP 'mcp-test-volume.vhdx'
          if (Test-Path -LiteralPath $volume) { throw 'Test VHD already exists' }
          "MCP_TEST_VHD=$volume" >> $env:GITHUB_ENV
          $commands = Join-Path $env:RUNNER_TEMP 'mcp-test-volume-create.txt'
          @"
          create vdisk file="$volume" maximum=128 type=expandable
          attach vdisk
          exit
          "@ | Set-Content -LiteralPath $commands -Encoding ascii
          & "$env:SystemRoot/System32/diskpart.exe" /s $commands
          if ($LASTEXITCODE -ne 0) { throw 'Cannot attach owned test VHD' }
          $image = Get-DiskImage -ImagePath $volume -ErrorAction Stop
          if (-not $image.Attached -or $image.ImagePath -ne $volume) {
            throw 'Owned VHD identity mismatch before initialization'
          }
          $disk = $image | Get-Disk -ErrorAction Stop
          if (@($disk).Count -ne 1 -or $disk.PartitionStyle -ne 'RAW') {
            throw 'Expected one new uninitialized owned VHD'
          }
          $disk | Initialize-Disk -PartitionStyle MBR -PassThru -ErrorAction Stop |
            New-Partition -UseMaximumSize -DriveLetter O -ErrorAction Stop |
            Format-Volume -FileSystem NTFS -NewFileSystemLabel MCP_TEST -Confirm:$false -ErrorAction Stop
          $mounted = Get-DiskImage -ImagePath $volume | Get-Disk | Get-Partition | Get-Volume
          if ($mounted.DriveLetter -ne 'O') { throw 'Owned VHD identity mismatch' }
          'MCP_TEST_VOLUME_OWNED=1' >> $env:GITHUB_ENV
          python -m venv "$env:RUNNER_TEMP/mcp-candidate"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate venv creation failed' }
          & "$env:RUNNER_TEMP/mcp-candidate/Scripts/python.exe" -m pip --isolated install --upgrade --no-deps --require-hashes -r requirements-trust-bootstrap.txt
          if ($LASTEXITCODE -ne 0) { throw 'Candidate trust bootstrap failed' }
          & "$env:RUNNER_TEMP/mcp-candidate/Scripts/python.exe" -m pip install `
            -r modules/infrastructure/foundups_mcp_bridge/requirements.txt 'pytest==9.0.3'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate dependency installation failed' }
      - name: Verify exact MCP contract and owned HTTP lifecycle
        shell: pwsh
        run: |
          @'
          import os, pathlib, subprocess, sys, xml.etree.ElementTree as ET
          root = pathlib.Path.cwd()
          runtime = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mcp-candidate'
          out = pathlib.Path('O:/evidence'); out.mkdir()
          for name in ('home', 'temp'): (out / name).mkdir()
          config = out / 'pytest.ini'; config.write_text('[pytest]\n', encoding='utf-8')
          env = {k:v for k,v in os.environ.items() if k.upper() in {
              'SYSTEMROOT','WINDIR','COMSPEC','PATH','PATHEXT','OS',
              'NUMBER_OF_PROCESSORS','PROCESSOR_ARCHITECTURE'}}
          env.update(HOME=str(out/'home'), USERPROFILE=str(out/'home'),
                     TEMP=str(out/'temp'), TMP=str(out/'temp'),
                     PYTHONDONTWRITEBYTECODE='1', PYTHONNOUSERSITE='1',
                     PYTEST_DISABLE_PLUGIN_AUTOLOAD='1', PYTHONIOENCODING='utf-8',
                     FOUNDUPS_MCP_TEST_PYTHON=str(runtime/'Scripts/python.exe'))
          suite = 'modules/infrastructure/foundups_mcp_bridge/tests/'
          command = [str(runtime/'Scripts/python.exe'), '-B', '-m', 'pytest',
                     '-c', str(config), '--noconftest', '--import-mode=importlib',
                     '-p', 'no:cacheprovider', '-o', 'pythonpath='+str(root),
                     '--basetemp=O:/pytest-temp', '--junitxml=O:/evidence/tests.xml',
                     '-v', '--tb=short', *[suite+n for n in (
                       'test_mcp_launcher_http.py', 'test_mcp_server_sse.py',
                       'test_reddog_holoindex_query_runtime_candidate_binding.py')]]
          result = subprocess.run(command, env=env, cwd=root, timeout=300, check=False)
          if result.returncode: raise SystemExit(result.returncode)
          cases = ET.parse(out/'tests.xml').findall('.//testcase')
          if len(cases) != 49 or any(c.find(tag) is not None for c in cases
                                    for tag in ('failure','error','skipped')):
              raise SystemExit('Expected all 49 MCP criteria to pass without skips')
          print('MCP compatibility: 49 passed; owned Windows lifecycle included')
          '@ | python -I -B -
          if ($LASTEXITCODE -ne 0) { throw 'MCP qualification failed' }
      - name: Verify shared runtime path and Windows stream contracts
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: |
          & "$env:RUNNER_TEMP/mcp-candidate/Scripts/python.exe" -B -m pytest -q `
            -c O:/evidence/pytest.ini --noconftest --import-mode=importlib `
            -p no:cacheprovider -o "pythonpath=$env:GITHUB_WORKSPACE" --basetemp=O:/shared-path-tests `
            --junitxml=O:/evidence/shared-path-tests.xml `
            modules/infrastructure/shared_utilities/tests/test_runtime_artifact_safety.py `
            modules/infrastructure/shared_utilities/tests/test_runtime_artifact_windows_safety.py
          if ($LASTEXITCODE -ne 0) { throw 'Shared runtime path contracts failed' }
      - uses: actions/upload-artifact@v4
        if: always() && env.MCP_TEST_VOLUME_OWNED == '1'
        with:
          name: mcp-runtime-compatibility
          path: O:/evidence/
      - name: Release owned test volume
        if: always() && env.MCP_TEST_VHD != ''
        shell: pwsh
        run: |
          $expected = Join-Path $env:RUNNER_TEMP 'mcp-test-volume.vhdx'
          if ($env:MCP_TEST_VHD -ne $expected) { throw 'Unexpected owned VHD path' }
          if (Test-Path -LiteralPath $expected) {
            $disk = Get-DiskImage -ImagePath $expected -ErrorAction Stop
            if ($disk.Attached) { Dismount-DiskImage -ImagePath $expected -ErrorAction Stop }
            if ((Get-DiskImage -ImagePath $expected).Attached) { throw 'VHD still attached' }
          }

  acoustic-x-adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install separate Acoustic Lab requirements
        shell: bash
        run: |
          set -euo pipefail
          python -B -m venv "$RUNNER_TEMP/acoustic-venv"
          "$RUNNER_TEMP/acoustic-venv/bin/python" -m pip --isolated install --upgrade --no-deps --require-hashes -r requirements-trust-bootstrap.txt
          "$RUNNER_TEMP/acoustic-venv/bin/python" -m pip --isolated install --index-url https://pypi.org/simple --report "$RUNNER_TEMP/acoustic-target-install.json" -r modules/platform_integration/acoustic_lab/requirements.txt
          "$RUNNER_TEMP/acoustic-venv/bin/python" -m pip --isolated check
      - name: Verify controlled X adapter, multipart and Web3 boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/acoustic-home" "$RUNNER_TEMP/acoustic-tmp"
          env -i PATH="$RUNNER_TEMP/acoustic-venv/bin:/usr/bin:/bin" \
            HOME="$RUNNER_TEMP/acoustic-home" TMPDIR="$RUNNER_TEMP/acoustic-tmp" \
            LANG=C.UTF-8 PYTHONUTF8=1 PYTHONDONTWRITEBYTECODE=1 \
            PYTHON_DOTENV_DISABLED=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 \
            PYTHONPATH="$GITHUB_WORKSPACE/modules/platform_integration/acoustic_lab" \
            PYCRYPTODOME_DISABLE_GMP=1 \
            NUMBA_CACHE_DIR="$RUNNER_TEMP/acoustic-tmp/numba" \
            PR1338_QUALIFICATION_TMP="$RUNNER_TEMP/acoustic-tmp" \
            ACOUSTIC_CI_REPORT="$RUNNER_TEMP/acoustic-tmp/acoustic-adapter.json" \
            ACOUSTIC_CI_COMMIT="$GITHUB_SHA" \
            "$RUNNER_TEMP/acoustic-venv/bin/python" -B - <<'PY'
          import hashlib, json, os, socket, sqlite3, subprocess, sys, sysconfig, tempfile
          import xml.etree.ElementTree as ET
          from pathlib import Path


          root = Path.cwd().resolve()
          runner_source = root / '.github/workflows/ci.yml'
          checkout_commit = os.environ['ACOUSTIC_CI_COMMIT']
          runner_sha256 = hashlib.sha256(runner_source.read_bytes()).hexdigest()

          report_path = Path(os.environ['ACOUSTIC_CI_REPORT']).resolve()
          output_root = Path(os.environ['TMPDIR']).resolve()
          assert report_path.parent == output_root, 'report must remain inside owned acoustic temp'
          owned_temp = output_root / 'temp'
          owned_temp.mkdir()
          source_files = [
              'modules/platform_integration/acoustic_lab/requirements.txt',
              'modules/platform_integration/acoustic_lab/src/ethereum_logger.py',
              'modules/platform_integration/acoustic_lab/tests/test_acoustic_processor.py',
              'modules/platform_integration/acoustic_lab/tests/test_web_app.py',
              '.github/workflows/ci.yml',
          ]
          source_before = {p: hashlib.sha256((root / p).read_bytes()).hexdigest() for p in source_files}
          libroots = {Path(p).resolve() for k, p in sysconfig.get_paths().items() if k in ('stdlib', 'platstdlib', 'purelib', 'platlib')}
          runtime_archives = {}
          for value in sys.path:
              candidate = Path(value).resolve()
              if (candidate.name == f'python{sys.version_info.major}{sys.version_info.minor}.zip'
                      and candidate.is_relative_to(Path(sys.base_prefix).resolve())):
                  runtime_archives[candidate] = hashlib.sha256(candidate.read_bytes()).hexdigest() if candidate.is_file() else None
          from importlib.metadata import distribution, version
          probe_sources = {}
          for package, relative in [('urllib3', 'urllib3/util/connection.py'), ('numpy', 'numpy/testing/_private/utils.py')]:
              dist = distribution(package)
              location = Path(dist.locate_file(relative)).resolve()
              probe_sources[package] = {'version': dist.version, 'path': str(location), 'sha256': hashlib.sha256(location.read_bytes()).hexdigest()}
          packages = {name: version(name) for name in ('pytest', 'web3', 'eth-account', 'ckzg', 'requests', 'urllib3', 'numpy')}
          os.environ.clear()
          os.environ.update(HOME=str(owned_temp), USERPROFILE=str(owned_temp), APPDATA=str(owned_temp), LOCALAPPDATA=str(owned_temp),
              TMP=str(owned_temp), TEMP=str(owned_temp), TMPDIR=str(owned_temp), PYTHON_DOTENV_DISABLED='1',
              PYTHONDONTWRITEBYTECODE='1', PYTEST_DISABLE_PLUGIN_AUTOLOAD='1', PYTHONUTF8='1',
              PYCRYPTODOME_DISABLE_GMP='1', NUMBA_ENABLE_AVX='0', NUMBA_CACHE_DIR=str(owned_temp / 'numba'),
              PR1338_QUALIFICATION_TMP=str(owned_temp), ACOUSTIC_CI_REPORT=str(report_path))
          sys.dont_write_bytecode = True
          sys.pycache_prefix = str(owned_temp / 'pycache')
          tempfile.tempdir = str(owned_temp)
          config = owned_temp / 'pytest.ini'
          config.write_text('[pytest]\n', encoding='utf-8')
          file_events = []
          hashing = False
          native_constructor, native_null_opens = None, 0
          native_null_open_flags = []
          devnull_code = subprocess.Popen._get_devnull.__code__
          subprocess_sha256 = hashlib.sha256(Path(subprocess.__file__).read_bytes()).hexdigest()

          def deny_file(event, path=None):
              frames, frame = set(), sys._getframe(1)
              while frame is not None:
                  frames.add((str(frame.f_globals.get('__name__')), frame.f_code.co_name))
                  frame = frame.f_back
              category = None
              if path is not None:
                  p = Path(path).resolve()
                  category = ('runner_source' if p == runner_source else
                              'platform_null' if p == Path(os.devnull).resolve() else
                              'repository:' + p.relative_to(root).as_posix() if p.is_relative_to(root) else
                              'owned_output' if p.is_relative_to(output_root) else
                              'installed_runtime' if any(p.is_relative_to(folder) for folder in libroots) else
                              'external_suffix:' + p.suffix)
              file_events.append({'phase': phase, 'event': event, 'path_class': category,
                                  'callers': sorted(frames)[:40], 'callers_truncated': len(frames) > 40})
              (output_root / 'file-events.json').write_text(json.dumps(file_events), encoding='utf-8')
              raise PermissionError('Python-level file/account/SQLite guard: ' + event)

          def owned(path):
              return Path(os.fsdecode(path)).resolve().is_relative_to(output_root)

          def file_audit(event, args):
              global hashing, native_null_opens
              if event == 'sqlite3.connect':
                  deny_file('sqlite3.connect')
              if event == 'import' and str(args[0]).split('.')[0] in ('dotenv', 'openai', 'anthropic', 'boto3', 'google'):
                  deny_file('account_config_import')
              if event == 'open':
                  # Only stdio and handles obtained through already guarded opens are inherited.
                  if isinstance(args[0], int):
                      return
                  p = Path(os.fsdecode(args[0])).resolve()
                  mode, flags = args[1] or '', args[2] or 0
                  writing = any(x in mode for x in 'wax+') or flags & (os.O_WRONLY | os.O_RDWR | os.O_CREAT | os.O_TRUNC | os.O_APPEND)
                  if writing:
                      caller = sys._getframe(1)
                      if (phase == 'owned_child' and native_constructor is not None and native_null_opens == 0
                              and caller.f_code is devnull_code and caller.f_locals.get('self') is native_constructor
                              and p == Path(os.devnull).resolve() and args[1] is None
                              and flags == (os.O_RDWR | os.O_CLOEXEC)):
                          native_null_opens += 1
                          native_null_open_flags.append({'flags': flags, 'mode': args[1]})
                          return  # Exact stderr=DEVNULL open inside the admitted Linux constructor.
                      if not owned(p):
                          deny_file('write_outside_owned_output', p)
                  else:
                      if p.name.startswith('.env') or p.name in ('.netrc', '_netrc') or p.suffix in ('.pem', '.key') or any(x in ('.ssh', '.aws', '.azure') for x in p.parts):
                          deny_file('private_config_read')
                      if p == runner_source:
                          if not hashing:
                              hashing = True
                              try:
                                  assert hashlib.sha256(p.read_bytes()).hexdigest() == runner_sha256
                              finally:
                                  hashing = False
                          return
                      if p in runtime_archives:
                          if not hashing:
                              hashing = True
                              try:
                                  current = hashlib.sha256(p.read_bytes()).hexdigest() if p.is_file() else None
                                  assert current == runtime_archives[p], 'runtime archive changed'
                              finally:
                                  hashing = False
                          return
                      if owned(p) or p == Path(os.devnull).resolve():
                          return
                      if p.is_relative_to(root) and (p.suffix == '.py' or p.relative_to(root).as_posix() in source_before):
                          if not hashing:
                              hashing = True
                              try:
                                  source_before.setdefault(p.relative_to(root).as_posix(), hashlib.sha256(p.read_bytes()).hexdigest())
                              finally:
                                  hashing = False
                      elif not any(p.is_relative_to(folder) for folder in libroots):
                          deny_file('read_outside_source_runtime_output', p)
              if event in ('os.remove', 'os.rmdir', 'os.mkdir', 'os.chmod', 'os.chown', 'os.utime', 'os.truncate'):
                  if not owned(args[0]):
                      deny_file(event + '_outside_owned_output')
              if event in ('os.rename', 'os.link') and not all(owned(args[i]) for i in (0, 1)):
                  deny_file(event + '_outside_owned_output')
              if event == 'os.symlink' or event == 'os.chdir' and Path(args[0]).resolve() != root and not owned(args[0]):
                  deny_file(event)


          # Python API guards, not an OS sandbox or native-code confinement.
          events, phase = [], 'sanity'
          def reject(kind):
              def denied(*args, **kwargs):
                  frames, frame = set(), sys._getframe(1)
                  probe_files = set()
                  while frame is not None:
                      frames.add((frame.f_globals.get('__name__'), frame.f_code.co_name))
                      probe_files.add((frame.f_globals.get('__name__'), frame.f_code.co_name, str(Path(frame.f_code.co_filename).resolve())))
                      frame = frame.f_back
                  probe = None
                  if (kind == 'socket.bind' and len(args) > 1 and args[1] == ('::1', 0)
                          and ('urllib3.util.connection', '_has_ipv6') in frames
                          and ('urllib3.util.connection', '_has_ipv6', probe_sources['urllib3']['path']) in probe_files):
                      probe = 'urllib3-ipv6-capability'
                  if (kind == 'subprocess.Popen' and len(args) > 1 and args[1] == 'lscpu'
                          and ('numpy.testing._private.utils', 'check_support_sve') in frames
                          and ('numpy.testing._private.utils', 'check_support_sve', probe_sources['numpy']['path']) in probe_files):
                      probe = 'numpy-sve-capability'
                  # Static call-site provenance only: never argv, env or frame locals.
                  callers = sorted((str(module), name) for module, name in frames)
                  events.append({'phase': phase, 'api': kind, 'denied_probe': probe,
                                 'callers': callers[:40], 'callers_truncated': len(callers) > 40})
                  # These two import probes catch OSError; no operation is permitted.
                  raise PermissionError('Python-level CI effect guard: ' + kind)
              return denied

          for name in ('connect', 'connect_ex', 'bind', 'listen', 'sendto', 'sendmsg'):
              if hasattr(socket.socket, name):
                  setattr(socket.socket, name, reject('socket.' + name))
          for name in ('create_connection', 'getaddrinfo', 'gethostbyname',
                       'gethostbyname_ex', 'gethostbyaddr', 'getnameinfo'):
              setattr(socket, name, reject('socket.' + name))
          # Preserve the Popen class for asyncio and yt-dlp subclass declarations.
          original_popen_init = subprocess.Popen.__init__

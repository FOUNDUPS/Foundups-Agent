name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  mcp-runtime-compatibility:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated MCP candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path O:\) { throw 'O: is already owned; refusing to reuse it' }
          # A real volume preserves the O: identity through Path.resolve().
          # SUBST would resolve to its C:/D: backing directory.
          $volume = Join-Path $env:RUNNER_TEMP 'mcp-test-volume.vhdx'
          if (Test-Path -LiteralPath $volume) { throw 'Test VHD already exists' }
          "MCP_TEST_VHD=$volume" >> $env:GITHUB_ENV
          $commands = Join-Path $env:RUNNER_TEMP 'mcp-test-volume-create.txt'
          @"
          create vdisk file="$volume" maximum=128 type=expandable
          attach vdisk
          exit
          "@ | Set-Content -LiteralPath $commands -Encoding ascii
          & "$env:SystemRoot/System32/diskpart.exe" /s $commands
          if ($LASTEXITCODE -ne 0) { throw 'Cannot attach owned test VHD' }
          $image = Get-DiskImage -ImagePath $volume -ErrorAction Stop
          if (-not $image.Attached -or $image.ImagePath -ne $volume) {
            throw 'Owned VHD identity mismatch before initialization'
          }
          $disk = $image | Get-Disk -ErrorAction Stop
          if (@($disk).Count -ne 1 -or $disk.PartitionStyle -ne 'RAW') {
            throw 'Expected one new uninitialized owned VHD'
          }
          $disk | Initialize-Disk -PartitionStyle MBR -PassThru -ErrorAction Stop |
            New-Partition -UseMaximumSize -DriveLetter O -ErrorAction Stop |
            Format-Volume -FileSystem NTFS -NewFileSystemLabel MCP_TEST -Confirm:$false -ErrorAction Stop
          $mounted = Get-DiskImage -ImagePath $volume | Get-Disk | Get-Partition | Get-Volume
          if ($mounted.DriveLetter -ne 'O') { throw 'Owned VHD identity mismatch' }
          'MCP_TEST_VOLUME_OWNED=1' >> $env:GITHUB_ENV
          python -m venv "$env:RUNNER_TEMP/mcp-candidate"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate venv creation failed' }
          & "$env:RUNNER_TEMP/mcp-candidate/Scripts/python.exe" -m pip install `
            -r modules/infrastructure/foundups_mcp_bridge/requirements.txt 'pytest==9.0.3'
          if ($LASTEXITCODE -ne 0) { throw 'Candidate dependency installation failed' }
      - name: Verify exact MCP contract and owned HTTP lifecycle
        shell: pwsh
        run: |
          @'
          import os, pathlib, subprocess, sys, xml.etree.ElementTree as ET
          root = pathlib.Path.cwd()
          runtime = pathlib.Path(os.environ['RUNNER_TEMP']) / 'mcp-candidate'
          out = pathlib.Path('O:/evidence'); out.mkdir()
          for name in ('home', 'temp'): (out / name).mkdir()
          config = out / 'pytest.ini'; config.write_text('[pytest]\n', encoding='utf-8')
          env = {k:v for k,v in os.environ.items() if k.upper() in {
              'SYSTEMROOT','WINDIR','COMSPEC','PATH','PATHEXT','OS',
              'NUMBER_OF_PROCESSORS','PROCESSOR_ARCHITECTURE'}}
          env.update(HOME=str(out/'home'), USERPROFILE=str(out/'home'),
                     TEMP=str(out/'temp'), TMP=str(out/'temp'),
                     PYTHONDONTWRITEBYTECODE='1', PYTHONNOUSERSITE='1',
                     PYTEST_DISABLE_PLUGIN_AUTOLOAD='1', PYTHONIOENCODING='utf-8',
                     FOUNDUPS_MCP_TEST_PYTHON=str(runtime/'Scripts/python.exe'))
          suite = 'modules/infrastructure/foundups_mcp_bridge/tests/'
          command = [str(runtime/'Scripts/python.exe'), '-B', '-m', 'pytest',
                     '-c', str(config), '--noconftest', '--import-mode=importlib',
                     '-p', 'no:cacheprovider', '-o', 'pythonpath='+str(root),
                     '--basetemp=O:/pytest-temp', '--junitxml=O:/evidence/tests.xml',
                     '-v', '--tb=short', *[suite+n for n in (
                       'test_mcp_launcher_http.py', 'test_mcp_server_sse.py',
                       'test_reddog_holoindex_query_runtime_candidate_binding.py')]]
          result = subprocess.run(command, env=env, cwd=root, timeout=300, check=False)
          if result.returncode: raise SystemExit(result.returncode)
          cases = ET.parse(out/'tests.xml').findall('.//testcase')
          if len(cases) != 49 or any(c.find(tag) is not None for c in cases
                                    for tag in ('failure','error','skipped')):
              raise SystemExit('Expected all 49 MCP criteria to pass without skips')
          print('MCP compatibility: 49 passed; owned Windows lifecycle included')
          '@ | python -I -B -
          if ($LASTEXITCODE -ne 0) { throw 'MCP qualification failed' }
      - uses: actions/upload-artifact@v4
        if: always() && env.MCP_TEST_VOLUME_OWNED == '1'
        with:
          name: mcp-runtime-compatibility
          path: O:/evidence/
      - name: Release owned test volume
        if: always() && env.MCP_TEST_VHD != ''
        shell: pwsh
        run: |
          $expected = Join-Path $env:RUNNER_TEMP 'mcp-test-volume.vhdx'
          if ($env:MCP_TEST_VHD -ne $expected) { throw 'Unexpected owned VHD path' }
          if (Test-Path -LiteralPath $expected) {
            $disk = Get-DiskImage -ImagePath $expected -ErrorAction Stop
            if ($disk.Attached) { Dismount-DiskImage -ImagePath $expected -ErrorAction Stop }
            if ((Get-DiskImage -ImagePath $expected).Attached) { throw 'VHD still attached' }
          }

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r requirements.txt

      - name: Verify canonical test registry
        run: |
          python modules/infrastructure/wre_core/scripts/generate_test_registry.py --check

      - name: Run LinkedIn offline activity contracts
        run: python -I -B modules/platform_integration/linkedin_agent/tests/test_activity_skill_contracts.py -v

      - name: Run Qwen package import contracts
        run: python -I -S -B holo_index/tests/test_qwen_package_import.py -v

      - name: Run social scheduler execution evidence
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -I -B modules/platform_integration/social_media_orchestrator/tests/test_autonomous_scheduler.py TestExecutionEvidence TestPersistenceEvidence TestPublicationEvidence TestCallerPersistenceEvidence -v

      - name: Run post-commit runner entrypoint evidence
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -I -B modules/infrastructure/git_push_dae/tests/test_post_commit_social_runner.py TestEntrypointEvidence -v

      - name: Run RedDog correspondence and recipient contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          FOUNDUPS_DB_ENGINE: sqlite
          DATABASE_URL: ''
          FOUNDUPS_DB_PATH: ${{ runner.temp }}/correspondence-foundups.db
          WRE_PATTERN_MEMORY_DB: ${{ runner.temp }}/correspondence-pattern.db
          ANTIFAFM_LYRICS_DB: ${{ runner.temp }}/correspondence-lyrics.db
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          python -B -m pytest -v -s --tb=short -c /dev/null --noconftest \
            -o pythonpath=. -p no:cacheprovider \
            --basetemp="$RUNNER_TEMP/correspondence-pytest" \
            modules/communication/moltbot_bridge/tests/test_reddog_recipient_preflight.py
          node --test \
            modules/communication/moltbot_bridge/tests/test_reddog_correspondence_sender_boundary.mjs

      - name: Run effect-lease consensus boundary qualification
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m pip install "jsonschema==4.26.0" "cryptography==46.0.7"
          python -I -B - <<'PY'
          from pathlib import Path
          import hashlib,json,os,platform,subprocess,sys,tempfile,types
          import xml.etree.ElementTree as ET
          if not __debug__ or not sys.dont_write_bytecode:
              raise RuntimeError('Assertions and no-bytecode required')
          R=Path.cwd().resolve()
          D=Path(os.environ['RUNNER_TEMP'])/'effect-consensus-evidence'
          D.mkdir();TMP=D/'temp';TMP.mkdir();PROFILE=D/'profile';PROFILE.mkdir()
          config=D/'pytest.ini';config.write_text('[pytest]\n',encoding='utf-8')
          # Tracked source at the exact CI checkout; no application import for inventory.
          paths=set(subprocess.check_output(['git','ls-files','-z','--','*.py']).decode('utf-8').rstrip('\0').split('\0'))
          def bindings():
              return {p:hashlib.sha256((R/p).read_bytes()).hexdigest() for p in sorted(paths)}
          before=bindings()
          keep={k:v for k,v in os.environ.items() if k in ('PATH','LANG','LC_ALL')}
          os.environ.clear();os.environ.update(keep)
          os.environ.update(HOME=str(PROFILE),TMPDIR=str(TMP),TMP=str(TMP),TEMP=str(TMP),
              PYTHONDONTWRITEBYTECODE='1',PYTEST_DISABLE_PLUGIN_AUTOLOAD='1',
              FOUNDUPS_DB_ENGINE='sqlite',DATABASE_URL='',FOUNDUPS_DB_PATH=str(TMP/'unrequested.db'))
          tempfile.tempdir=str(TMP)
          sys.path.insert(0,str(R))
          platform._node=lambda default='':'rsi-disposable-test-host'
          platform.machine=lambda:'x86_64'
          # Reuse the reviewed descriptor observer without importing app packages.
          import importlib.util
          spec=importlib.util.spec_from_file_location('reviewer_path_observer',
              R/'modules/communication/moltbot_bridge/tests/run_reddog_reviewer_authority_linux.py')
          observer=importlib.util.module_from_spec(spec);spec.loader.exec_module(observer)
          blocked = []; sqlite_opens = []; repo_reads = set()
          def norm(value):
              p = os.fsdecode(value)
              if p.startswith('\\\\?\\') and len(p)>5 and p[5]==':': p=p[4:]
              return Path(p).resolve()
          def owned(value):
              try: return norm(value).is_relative_to(D)
              except (TypeError,ValueError,OSError): return False
          def deny(event, detail=''):
              record={'event':event, 'detail':str(detail)[:200]}
              blocked.append(record)
              with (D/'blocked.jsonl').open('a',encoding='utf-8') as evidence: evidence.write(json.dumps(record)+'\n')
              raise RuntimeError('caller_test_guard_denied:'+event+':'+str(detail)[:200])
          def audit(event, args):
              if event.startswith('socket.') or event in ('subprocess.Popen','os.system','os.posix_spawn','os.startfile','os.startfile/2','os.fork','os.exec','os.kill'):
                  deny(event)
              if event=='import' and str(args[0]).split('.')[0] in ('openai','anthropic','requests','httpx','llama_cpp','torch','transformers','dotenv','psycopg','psycopg2'):
                  deny(event,'provider/model import')
              if event=='sqlite3.connect':
                  try:
                      value=args[0]
                      if type(value) not in (str,type(TMP)) or str(value).startswith(('file:',':memory:','\\\\')):
                          raise ValueError('unsupported_database_form')
                      target=observer._database_path(value,TMP/'pytest')
                      parts=target.relative_to(TMP/'pytest').parts
                      if Path(value)!=target or not Path(value).is_absolute(): raise ValueError('noncanonical_path')
                      if len(parts)!=3 or parts[1:]!=('high-water','authority.sqlite3'):
                          raise ValueError('unselected_fixture_database')
                      if len(sqlite_opens)>=1024: raise ValueError('fixture_connection_budget')
                  except (TypeError,ValueError,OSError):
                      deny('sqlite3.connect','unqualified_fixture_database')
                  sqlite_opens.append(str(target))
              if event=='open' and isinstance(args[0],(str,bytes)):
                  p=observer._OPEN_TARGET.get() or norm(args[0]); mode=args[1]; flags=args[2]
                  write=(isinstance(mode,str) and any(c in mode for c in 'wax+')) or bool(flags & (os.O_WRONLY|os.O_RDWR|os.O_CREAT|os.O_TRUNC|os.O_APPEND))
                  if write and not owned(p) and p!=norm(os.devnull): deny('open_write',p)
                  if not write and not owned(p) and (p.name.startswith('.env') or p.suffix.lower() in ('.gguf','.safetensors','.pem','.key') or any(x in ('.ssh','.aws','.azure','.config') for x in p.parts)):
                      deny('sensitive_read',p.name)
                  if p.is_relative_to(R) and p.suffix=='.py':
                      relative=str(p.relative_to(R)).replace('\\','/')
                      if relative not in paths: deny('unlisted_repository_source',relative)
                      repo_reads.add(relative)
              if event in ('os.remove','os.rmdir','os.mkdir','os.chmod','os.utime','os.truncate') and not isinstance(args[0],int):
                  index={'os.remove':1,'os.rmdir':1,'os.mkdir':2,'os.chmod':2,'os.utime':3}.get(event)
                  descriptor=args[index] if index is not None and len(args)>index else None
                  if not owned(observer._resolved(args[0],descriptor)): deny(event,args[0])
              if event in ('os.rename','os.replace','os.link'):
                  if not all(owned(observer._resolved(p,fd)) for p,fd in zip(args[:2],args[2:4])): deny(event)
              if event=='os.symlink': deny(event,'pytest convenience symlink disabled')
              if event=='os.chdir' and norm(args[0])!=R and not owned(args[0]): deny(event)
          sys.addaudithook(audit)
          restore_open=observer._observe_open_targets()
          isolated = ['modules','modules.communication','modules.communication.moltbot_bridge',
                      'modules.communication.moltbot_bridge.src','modules.communication.moltbot_bridge.tests',
                      'modules.infrastructure','modules.infrastructure.secrets_mcp']
          for name in isolated:
              assert name not in sys.modules
              module=types.ModuleType(name)
              module.__path__=[str(R/Path(*name.split('.')))]
              sys.modules[name]=module
              if '.' in name:
                  parent, child=name.rsplit('.',1)
                  setattr(sys.modules[parent],child,module)

          import pytest
          nodes=['modules/communication/moltbot_bridge/tests/test_reddog_authoritative_use_lease_contract_security.py::test_effect_lease_request_preserves_distinct_consensus_domain[HIGH]', 'modules/communication/moltbot_bridge/tests/test_reddog_authoritative_use_lease_contract_security.py::test_effect_lease_request_preserves_distinct_consensus_domain[ULTRA]', 'modules/communication/moltbot_bridge/tests/test_reddog_signer_independent_secret_grant_provider.py::test_effect_request_provider_rejects_before_owner_admission[HIGH-missing]', 'modules/communication/moltbot_bridge/tests/test_reddog_signer_independent_secret_grant_provider.py::test_effect_request_provider_rejects_before_owner_admission[HIGH-foreign_mapping]', 'modules/communication/moltbot_bridge/tests/test_reddog_signer_independent_secret_grant_provider.py::test_effect_request_provider_rejects_before_owner_admission[ULTRA-missing]', 'modules/communication/moltbot_bridge/tests/test_reddog_signer_independent_secret_grant_provider.py::test_effect_request_provider_rejects_before_owner_admission[ULTRA-foreign_mapping]', 'modules/communication/moltbot_bridge/tests/test_reddog_signer_independent_secret_grant_provider.py::test_elevated_client_rejects_effect_role_before_provider_lease[HIGH]', 'modules/communication/moltbot_bridge/tests/test_reddog_signer_independent_secret_grant_provider.py::test_elevated_client_rejects_effect_role_before_provider_lease[ULTRA]', 'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_capability.py::test_delegated_request_pair_matches_without_authority_issuance', 'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_capability.py::test_effect_request_cannot_replace_delegated_child[principal]', 'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_capability.py::test_effect_request_cannot_replace_delegated_child[reddog]']

          # Frozen pure binding controls; retain the original eleven domain controls.
          nodes += [
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_golden_projection_and_no_mutation',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_parent_mismatch[mapping]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_parent_mismatch[operation]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_parent_mismatch[work_order_id]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_parent_mismatch[work_order_digest]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_parent_mismatch[boolean_time]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_parent_mismatch[future]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_parent_mismatch[identity_bound]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_parent_mismatch[authority_bound]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_parent_mismatch[expired]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_target_shape[proof]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_target_shape[ultra]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_target_shape[target_mapping]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_target_shape[expected_subclass]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_target_shape[proof_key]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_target_shape[boolean_now]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_target_shape[live_enqueue]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_expected_target_substitution[requester]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_expected_target_substitution[key]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_expected_target_substitution[generation]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_expected_target_substitution[replay]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_expected_target_substitution[nonce]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_expected_target_substitution[lifetime]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_expected_target_substitution[bool_int]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_expected_target_substitution[float_int]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_supplied_binding_substitution[None]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_supplied_binding_substitution[schema_version]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_supplied_binding_substitution[parent_authority_request_digest]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_supplied_binding_substitution[target_signing_request_digest]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_supplied_binding_substitution[effect_request_digest]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_supplied_binding_substitution[extra]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_canonicalization.py::test_effect_binding_rejects_supplied_binding_substitution[missing]',
          ]
          # Retain the existing structural gates alongside domain/binding controls.
          nodes += [
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_structure.py::test_modules_have_no_shell_network_or_key_generation_imports',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_structure.py::test_consensus_modules_remain_bounded_lego_components',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_structure.py::test_consensus_test_modules_are_bounded_lego_components',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_structure.py::test_test_only_downstream_consensus_never_enters_production_sources',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_structure.py::test_production_runtime_does_not_compose_unsigned_elevated_sources',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_structure.py::test_modified_runtime_host_functions_do_not_add_wsp62_debt',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_structure.py::test_touched_legacy_runtime_hosts_do_not_exceed_base_debt',
          ]
          # Frozen inert effect-context data controls; no approval is issued.
          nodes += [
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_effect_context.py::test_effect_context_golden_roundtrip_and_immutable_copies',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_effect_context.py::test_effect_context_has_no_clock_or_ttl_admission[past]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_effect_context.py::test_effect_context_has_no_clock_or_ttl_admission[future_long]',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_effect_context.py::test_effect_context_accepts_exact_field_bounds',
              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_effect_context.py::test_effect_context_whole_wire_byte_bound[at_limit]',

      - name: Run lifecycle dependency selection regression
        id: lifecycle_selection
        env:
          LIFECYCLE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FOUNDUPS_SOCKET_KERNEL_CHARACTERIZATION: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

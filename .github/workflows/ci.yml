              'modules/communication/moltbot_bridge/tests/test_reddog_elevated_authority_consensus_effect_context.py::test_effect_context_canonical_apis_reject_invalid_internal_context[time]',
          ]
          args=nodes+['-c',str(config),'--rootdir='+str(R),'--noconftest','--import-mode=importlib',
              '-p','no:cacheprovider','-v','--tb=short','--basetemp='+str(TMP/'pytest'),
              '--junitxml='+str(D/'results.xml')]
          status=int(pytest.main(args))
          after=bindings();xml=ET.parse(D/'results.xml').getroot()
          cases=list(xml.iter('testcase'))
          counts={k:sum(int(s.get(k,0)) for s in xml) for k in ('tests','failures','errors','skipped')}
          exact=len(cases)==len(nodes) and {x.get('name') for x in cases}=={n.split('::',1)[1] for n in nodes}
          unexpected=[x for x in blocked if x['event']!='os.symlink']
          receipt={'returncode':status,'counts':counts,'exact_cases':exact,'hashes_stable':before==after,
              'blocked_events':blocked,'observed_source_read_bindings':{p:after[p] for p in sorted(repo_reads)},
              'limits':['Python audit constraints, not OS isolation.','Domain, pure binding/context and structural controls; no issued effect lease or RSI benefit.']}
          (D/'receipt.json').write_text(json.dumps(receipt,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:receipt[k] for k in ('counts','exact_cases','hashes_stable')}))
          raise SystemExit(status or (2 if unexpected or not exact or before!=after or counts['skipped'] else 0))
          PY

      - name: Upload effect-lease qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effect-consensus-qualification
          path: |
            ${{ runner.temp }}/effect-consensus-evidence/results.xml
            ${{ runner.temp }}/effect-consensus-evidence/receipt.json
            ${{ runner.temp }}/effect-consensus-evidence/blocked.jsonl
          if-no-files-found: ignore

      - name: Run WRE local proposal caller contracts
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          WRE_ENABLE_IRONCLAW_WORKER: '0'
          FOUNDUPS_DB_ENGINE: sqlite
          DATABASE_URL: ''
          FOUNDUPS_DB_PATH: ${{ runner.temp }}/proposal-foundups.db
          WRE_PATTERN_MEMORY_DB: ${{ runner.temp }}/proposal-pattern.db
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          python -B -m pytest --tb=short -c /dev/null --noconftest \
            -o pythonpath=. -p no:cacheprovider \
            --basetemp="$RUNNER_TEMP/proposal-caller-pytest" -v \
            modules/infrastructure/wre_core/tests/test_wre_execution_truth.py

      - name: Run WRE RSI measurement contract tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          FOUNDUPS_DB_ENGINE: sqlite
          DATABASE_URL: ''
          FOUNDUPS_DB_PATH: ${{ runner.temp }}/rsi-foundups.db
          WRE_PATTERN_MEMORY_DB: ${{ runner.temp }}/rsi-pattern.db
          ANTIFAFM_LYRICS_DB: ${{ runner.temp }}/rsi-lyrics.db
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          python -B -m pytest -q --tb=short --noconftest -o pythonpath=. -p no:cacheprovider \
            --basetemp="$RUNNER_TEMP/rsi-measurement-pytest" \
            modules/infrastructure/wre_core/tests/test_wre_auto_researcher.py \
            modules/infrastructure/wre_core/tests/test_wre_research_evaluator_inputs.py \
            modules/infrastructure/wre_core/tests/test_wre_research_program_consumption.py \
            modules/infrastructure/wre_core/tests/test_dashboard_snapshot_export.py

      - name: Run WRE merge sentinel prerequisite tests
        id: merge_sentinel
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          FOUNDUPS_DB_PATH: ${{ runner.temp }}/merge-sentinel-foundups.db
          WRE_PATTERN_MEMORY_DB: ${{ runner.temp }}/merge-sentinel-pattern.db
          ANTIFAFM_LYRICS_DB: ${{ runner.temp }}/merge-sentinel-lyrics.db
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          python -B -m pytest -q --tb=short -c /dev/null --noconftest \
            --import-mode=importlib -p no:cacheprovider \
            --basetemp="$RUNNER_TEMP/merge-sentinel-pytest" \
            --junitxml="$RUNNER_TEMP/merge-sentinel.xml" \
            modules/infrastructure/wre_core/tests/test_git_main_merge_sentinel.py

      - name: Upload merge sentinel prerequisite results
        if: always() && steps.merge_sentinel.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: merge-sentinel-prerequisites
          path: ${{ runner.temp }}/merge-sentinel.xml
          if-no-files-found: error

      - name: Run lifecycle dependency selection regression
        id: lifecycle_selection
        env:
          LIFECYCLE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          FOUNDUPS_SOCKET_KERNEL_CHARACTERIZATION: '1'
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
          PYTHONDONTWRITEBYTECODE: '1'
          FOUNDUPS_DB_PATH: ${{ runner.temp }}/lifecycle-foundups.db
          WRE_PATTERN_MEMORY_DB: ${{ runner.temp }}/lifecycle-pattern.db
          ANTIFAFM_LYRICS_DB: ${{ runner.temp }}/lifecycle-lyrics.db
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: |
          python -m pip install cryptography
          [[ "$LIFECYCLE_BASE" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin "$LIFECYCLE_BASE"
          parent="$RUNNER_TEMP/lifecycle-parent"
          mkdir "$parent"
          git archive "$LIFECYCLE_BASE" | tar -x -C "$parent"
          mkdir "$RUNNER_TEMP/lifecycle-results"
          python -c 'import importlib.metadata as m,json; print(json.dumps({p:m.version(p) for p in ("pytest","cryptography")}))' > "$RUNNER_TEMP/lifecycle-results/packages.json"
          selected=(
            modules/communication/moltbot_bridge/tests/test_reddog_external_signer_os_observer.py
            modules/communication/moltbot_bridge/tests/test_reddog_signer_socket_service_healthcheck.py
            modules/communication/moltbot_bridge/tests/test_reddog_external_signer_lifecycle_admission.py
            modules/communication/moltbot_bridge/tests/test_reddog_external_signer_lifecycle_generation_race.py
            modules/communication/moltbot_bridge/tests/test_reddog_signer_current_generation_use_time_binding.py
            modules/communication/moltbot_bridge/tests/test_reddog_execution_valve_queue_use_time_binding.py
            modules/communication/moltbot_bridge/tests/test_reddog_signer_mutual_peer_handshake.py::test_handshake_modules_follow_wsp62_boundaries
          )
          failed=0
          for revision in parent candidate; do
            export FOUNDUPS_DB_PATH="$RUNNER_TEMP/lifecycle-$revision-foundups.db"
            export WRE_PATTERN_MEMORY_DB="$RUNNER_TEMP/lifecycle-$revision-pattern.db"
            export ANTIFAFM_LYRICS_DB="$RUNNER_TEMP/lifecycle-$revision-lyrics.db"
            root="$GITHUB_WORKSPACE"
            if [[ "$revision" == parent ]]; then root="$parent"; fi
            (cd "$root" && python -B -m pytest -q --tb=short -c /dev/null --noconftest \
              --import-mode=importlib -p no:cacheprovider \
              -o junit_family=xunit1 \
              --basetemp="$RUNNER_TEMP/lifecycle-$revision-pytest" \
              --junitxml="$RUNNER_TEMP/lifecycle-results/$revision.xml" \
              "${selected[@]}") || failed=1
          done
          exit "$failed"

      - name: Upload lifecycle dependency selection results
        if: always() && steps.lifecycle_selection.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-dependency-selection
          path: ${{ runner.temp }}/lifecycle-results/
          if-no-files-found: error

      - name: Run RedDog fast test tier
        working-directory: extensions/reddog
        run: npm test

      - name: Run simulator tests
        run: |
          python -m pytest modules/foundups/simulator/tests/ -v --tb=short --ignore=modules/foundups/simulator/tests/test_sse_server.py

      - name: Run FAM tests
        run: |
          python -m pytest modules/foundups/agent_market/tests/ -v --tb=short

      - name: Run RedDog local diagnostic security gates
        run: |
          node extensions/reddog/tests/test_backend_compatibility_preflight.js
          node extensions/reddog/tests/test_holoindex_blocked_request_recovery.js
          python -m pytest modules/communication/moltbot_bridge/tests/test_reddog_holoindex_blocked_request_recovery.py -v --tb=short
          python -m pytest scripts/tests/test_reddog_holoindex_blocked_request_recovery_once.py -v --tb=short
          python -m pytest tests/test_reddog_model_freshness_query_once.py -v --tb=short

      - name: Run RedDog bounded resident-chain regression
        run: |
          python -m pip install "chromadb==1.5.5" "pytz>=2023.3" "psutil>=5.9.6"
          python -m pytest \
            modules/communication/moltbot_bridge/tests/test_reddog_openclaw_hermes_0102_worker_dispatch_runtime.py \
            modules/communication/moltbot_bridge/tests/test_reddog_resident_queue_worker_dispatch_runtime_handler.py \
            modules/communication/moltbot_bridge/tests/test_reddog_resident_queue_worktree_create_handler.py \
            modules/communication/moltbot_bridge/tests/test_reddog_resident_queue_bounded_worker_pilot_handler.py \
            modules/communication/moltbot_bridge/tests/test_reddog_resident_queue_exact_sha_commit_handler.py \
            modules/communication/moltbot_bridge/tests/test_reddog_resident_queue_slice_verifier_handler.py \
            modules/communication/moltbot_bridge/tests/test_reddog_resident_queue_verified_draft_pr_publish_handler.py \
            modules/communication/moltbot_bridge/tests/test_reddog_resident_queue_verified_outcome_ratchet_handler.py \
            modules/communication/moltbot_bridge/tests/test_reddog_resident_queue_held_out_regression_gate_handler.py \
            modules/communication/moltbot_bridge/tests/test_reddog_resident_queue_pattern_memory_admission_handler.py \
            modules/communication/moltbot_bridge/tests/test_reddog_resident_queue_serial_loop.py \
            modules/communication/moltbot_bridge/tests/test_reddog_openclaw_gateway_artifact_provider.py \
            modules/communication/moltbot_bridge/tests/test_reddog_hermes_api_artifact_provider.py \
            modules/communication/moltbot_bridge/tests/test_reddog_progressive_execution_stage_policy.py \
            modules/communication/moltbot_bridge/tests/test_reddog_wre_queue_consumer_dryrun.py \
            modules/communication/moltbot_bridge/tests/test_reddog_resident_queue_orchestration_plan.py \
            modules/communication/moltbot_bridge/tests/test_reddog_resident_queue_work_order_invocation_handler.py \
            modules/communication/moltbot_bridge/tests/test_reddog_resident_queue_model_runtime_artifact_integration.py \
            modules/communication/moltbot_bridge/tests/test_reddog_main_openclaw_signed_worker_claim_loop_preflight.py \
            modules/communication/moltbot_bridge/tests/test_reddog_main_resident_queue_next_stage_dispatch_bootstrap.py \
            modules/communication/moltbot_bridge/tests/test_reddog_main_resident_queue_orchestration_plan_bootstrap.py \
            modules/communication/moltbot_bridge/tests/test_reddog_resident_queue_executor_plan_handler.py \
            -q --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff check
        run: ruff check modules/ --ignore E501,F401 --exit-zero

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets
        run: |
          # Check for common secret patterns in tracked files
          ! git grep -l "AIza\|sk-\|ghp_\|gho_\|AKIA" -- "*.py" "*.json" | grep -v node_modules | grep -v ".example" || echo "Warning: Possible secrets found"

      - name: Verify .env not tracked
        run: |
          ! git ls-files | grep "^\.env$" || (echo "ERROR: .env is tracked!" && exit 1)

  holoindex_freshness:
    runs-on: ubuntu-latest
    env:
      HOLOINDEX_CI_FRESHNESS_ENFORCED: ${{ vars.HOLOINDEX_CI_FRESHNESS_ENFORCED }}
      HOLOINDEX_FRESHNESS_RECEIPT: ${{ vars.HOLOINDEX_FRESHNESS_RECEIPT }}
      HOLOINDEX_SSD_PATH: ${{ vars.HOLOINDEX_SSD_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Determine changed paths
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --name-only --diff-filter=ACMRT \
              "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
              > .holoindex_changed_paths
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only --diff-filter=ACMRT \
              "${{ github.event.before }}" "${{ github.sha }}" \
              > .holoindex_changed_paths
          else
            git diff-tree --no-commit-id --name-only -r "${{ github.sha }}" \
              > .holoindex_changed_paths
          fi
          cat .holoindex_changed_paths

      - name: Check HoloIndex freshness receipt
        shell: bash
        run: |
          set -euo pipefail
          enforce_flag=""
          if [ "${HOLOINDEX_CI_FRESHNESS_ENFORCED:-0}" = "1" ]; then
            enforce_flag="--enforce-configured"
          fi
          python -m holo_index.ci_main_freshness_gate \
            --changed-paths-file .holoindex_changed_paths \
            --head-sha "${{ github.sha }}" \
            --pretty \
            ${enforce_flag}

  redteam_observation:
    # FOUNDUPS_AGENT_REDTEAM_CI_OBSERVATION_PHASE1
    #
    # Report-only observation of the agent red-team regression suite.
    # This job runs on every PR/push and surfaces results in CI logs +
    # uploads a JUnit artifact, but does NOT block merge. Activation
    # (blocking gate) is deferred to FOUNDUPS_AGENT_REDTEAM_CI_GATE_ACTIVATION_PHASE1
    # after the observation window completes.
    #
    # If this job fails / is unstable, the broader CI still passes — the
    # operator decides when to promote it to a required check based on
    # the audit doc's activation criteria.
    name: redteam observation (report-only)
    runs-on: ubuntu-latest
    continue-on-error: true   # report-only — must not block PRs in PHASE1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Red-team suite is stdlib + pytest only (no new deps installed
          # by this slice). Project requirements pulled in for parity with
          # the `test` job in case fixtures share runtime imports.
          pip install -r requirements.txt

      - name: Run red-team suite (report-only)
        # The suite must complete with zero skipped tests. We capture the
        # full JUnit report so the observation window can analyse failure
        # modes, runtime, and flake rate offline.
        # `--strict-markers` and explicit `--no-header` keep CI output
        # focused; `-rsxX` shows skipped/xfailed reasons (we expect none).
        run: |
          mkdir -p .redteam-observation
          python -m pytest \
            modules/infrastructure/wre_core/tests/redteam \
            -v --tb=short --no-header --strict-markers -rsxX \
            --junit-xml=.redteam-observation/redteam-report.xml \
            | tee .redteam-observation/redteam-stdout.log

      - name: Summarise observation
        # Runs on success or failure of the previous step; prints a one-
        # line summary (passed / failed / skipped / duration) so the
        # report-only status is visible at a glance in the CI log tail.
        if: always()
        run: |
          if [ -f .redteam-observation/redteam-report.xml ]; then
            python - <<'PY'
          import xml.etree.ElementTree as ET, os
          path = ".redteam-observation/redteam-report.xml"
          tree = ET.parse(path)
          root = tree.getroot()
          # JUnit may emit a single <testsuite> root or a <testsuites> wrapper.
          suites = root.findall("testsuite") if root.tag == "testsuites" else [root]
          tests = errors = failures = skipped = 0
          duration = 0.0
          for s in suites:
              tests    += int(s.attrib.get("tests", 0))
              errors   += int(s.attrib.get("errors", 0))
              failures += int(s.attrib.get("failures", 0))
              skipped  += int(s.attrib.get("skipped", 0))
              duration += float(s.attrib.get("time", 0))
          passed = tests - errors - failures - skipped
          status = "GREEN" if (errors == 0 and failures == 0 and skipped == 0) else "OBSERVE"
          print(f"[REDTEAM-OBSERVATION] status={status} tests={tests} passed={passed} "
                f"failed={failures} errored={errors} skipped={skipped} "
                f"duration={duration:.2f}s mode=report-only")
          PY
          else
            echo "[REDTEAM-OBSERVATION] status=NO_REPORT tests=? mode=report-only"
            echo "[REDTEAM-OBSERVATION] note: junit xml not produced — pytest likely errored before collection"
          fi

      - name: Upload red-team observation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .redteam-observation/redteam-report.xml
            .redteam-observation/redteam-stdout.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

              '--junitxml='+str(D/'results.xml')]
          try:
              status=int(pytest.main(args))
          finally:
              restore_open()
          after=bindings();xml=ET.parse(D/'results.xml').getroot()
          cases=list(xml.iter('testcase'))
          counts={k:sum(int(s.get(k,0)) for s in xml) for k in ('tests','failures','errors','skipped')}
          exact=len(cases)==len(nodes) and {x.get('name') for x in cases}=={n.split('::',1)[1] for n in nodes}
          unexpected=[x for x in blocked if x['event']!='os.symlink']
          receipt={'returncode':status,'counts':counts,'exact_cases':exact,'hashes_stable':before==after,

name: FoundUp brand context backend manifest once

on:
  push:
    branches:
      - feat/foundup-brand-context-20260919
    paths:
      - '.github/workflows/foundup-brand-context-backend-manifest-once.yml'
      - 'modules/communication/moltbot_bridge/src/reddog_registered_foundup_target_verifier.py'
      - 'modules/communication/moltbot_bridge/skillz/reddog_operations/SKILLz.md'
      - 'modules/infrastructure/wre_core/skillz/skills_registry_v2.json'
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/foundup-brand-context-20260919
          fetch-depth: 0
          persist-credentials: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Regenerate and verify backend manifest
        run: python .github/scripts/foundup_brand_manifest_once.py
      - name: Commit generated integrity state
        run: |
          if git diff --quiet -- scripts/reddog_backend_manifest.json scripts/tests/test_generate_reddog_backend_manifest.py extensions/reddog/backend_compatibility_constants.js; then
            echo "No manifest changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/reddog_backend_manifest.json scripts/tests/test_generate_reddog_backend_manifest.py extensions/reddog/backend_compatibility_constants.js
          git commit -m "chore(reddog): regenerate backend manifest for FoundUp brand context"
          git push origin HEAD:feat/foundup-brand-context-20260919

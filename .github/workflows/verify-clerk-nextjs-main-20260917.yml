name: Verify clerk-nextjs current main

on:
  push:
    branches:
      - 'verify/clerk-nextjs-main-20260917'

permissions:
  contents: read

jobs:
  verify-clerk-nextjs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact current-main snapshot
        uses: actions/checkout@v4
        with:
          ref: 32d470239a658f0390e8a4d6fe581731914fdc3b
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: clerk-nextjs/package-lock.json

      - name: Clean install
        working-directory: clerk-nextjs
        run: npm ci

      - name: Lint
        working-directory: clerk-nextjs
        run: npm run lint

      - name: Build
        working-directory: clerk-nextjs
        run: npm run build
